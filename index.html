<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Sans Couleurs</title>
<style>
  /* Police pour les textes de zone (voir la feature textes-de-zone). Le nom
     "DeltaruneExtended" est un choix libre (independant du nom du fichier),
     reutilise tel quel comme fontFamily cote Phaser. */
  @font-face {
    font-family: 'DeltaruneExtended';
    src: url('assets/fonts/undertale-deltarune-extended-fixed.otf') format('opentype');
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
  #game-container {
    width: 100%;
    height: 100%;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<div id="game-container"></div>

<!-- Phaser depuis le CDN : reste un script global classique. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.70.0/phaser.min.js"></script>

<!-- Le code du jeu est en modules ES : un seul point d'entree, le navigateur
     suit ensuite le graphe d'import tout seul (voir src/js/index.js). Pendant
     le dev, servir avec un serveur qui ne met pas en cache (VS Code Live
     Server) ou recharger en force (Cmd/Ctrl + Maj + R). -->
<script type="module" src="src/js/index.js"></script>
</body>
</html>
