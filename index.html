<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Sans Couleurs</title>
<style>
  /* Police pour les textes de zone (voir TextesDeZone dans game.js) — fichier
     fourni dans assets/font/. Le nom "DeltaruneExtended" est un choix libre
     (ne depend pas du nom interne du fichier), reutilise tel quel comme
     fontFamily cote Phaser. */
  @font-face {
    font-family: 'DeltaruneExtended';
    src: url('assets/font/undertale-deltarune-extended-fixed.otf') format('opentype');
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
  #game-container {
    width: 100%;
    height: 100%;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<div id="game-container"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.70.0/phaser.min.js"></script>
<script src="game.js"></script>
</body>
</html>
