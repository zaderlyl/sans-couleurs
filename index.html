<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Sans Couleurs</title>
<style>
  /* Police pour les textes de zone (voir TextesDeZone dans src/game.js) —
     fichier fourni dans assets/fonts/. Le nom "DeltaruneExtended" est un choix
     libre (ne depend pas du nom interne du fichier), reutilise tel quel comme
     fontFamily cote Phaser. */
  @font-face {
    font-family: 'DeltaruneExtended';
    src: url('assets/fonts/undertale-deltarune-extended-fixed.otf') format('opentype');
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
  #game-container {
    width: 100%;
    height: 100%;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<div id="game-container"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.70.0/phaser.min.js"></script>
<script>
  // Anti-cache : contrairement aux assets charges depuis src/game.js (voir
  // ParametreAntiCache la-bas), ce tag <script> n'a lui-meme aucun moyen
  // d'echapper au cache du navigateur avec un simple attribut src statique
  // — un game.js modifie sur le disque pouvait donc continuer a tourner
  // depuis une ancienne version mise en cache, sans aucun signe visible
  // (pas d'erreur : juste un comportement perime). Injecte donc le script
  // avec un parametre "?v=" different a chaque chargement de page, exactement
  // comme pour les autres fichiers.
  const ScriptJeu = document.createElement('script');
  ScriptJeu.src = 'src/game.js?v=' + Date.now();
  document.body.appendChild(ScriptJeu);
</script>
</body>
</html>
